global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "Validator_0"
    static_configs:
      - targets: ["host.docker.internal:9184"]
        labels:
          host: validator0
          network: local
  # - job_name: "Client_1"
  #   static_configs:
  #     - targets: ["host.docker.internal:8081"]
  #       labels:
  #         host: client1
  #         network: local
  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          host: node
          network: local
